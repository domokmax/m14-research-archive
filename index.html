<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="M14 A股复盘研报公开只读档案">
  <title>M14 · 市场复盘档案</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="paper-noise" aria-hidden="true"></div>
  <header class="masthead">
    <div>
      <p class="eyebrow">A-SHARE RESEARCH · READ ONLY</p>
      <h1>M14 市场复盘档案</h1>
      <p class="dek">一份按生成日期归档的研究手记。桌面端是唯一写入源，此处仅供阅读与分享。</p>
    </div>
    <div class="edition">
      <span id="updatedAt">正在载入</span>
      <span id="reportCount">— 篇研报</span>
    </div>
  </header>

  <main class="layout">
    <aside class="archive-rail" aria-label="档案筛选">
      <div class="rail-head">
        <span>档案日期</span>
        <button id="railToggle" class="icon-button" type="button" aria-label="收起日期栏">‹</button>
      </div>
      <label class="search">
        <span>检索</span>
        <input id="searchInput" type="search" placeholder="标题、正文或标签">
      </label>
      <div id="typeFilters" class="type-filters"></div>
      <nav id="dateList" class="date-list"></nav>
    </aside>

    <section class="reading-room">
      <div class="reading-toolbar">
        <div>
          <span class="toolbar-label">当前档案</span>
          <strong id="activeDate">全部日期</strong>
        </div>
        <div class="pager">
          <button id="prevReport" type="button">上一篇</button>
          <span id="position">— / —</span>
          <button id="nextReport" type="button">下一篇</button>
        </div>
      </div>
      <article id="report" class="report-card" aria-live="polite">
        <p class="loading">正在整理档案页……</p>
      </article>
    </section>
  </main>

  <footer>公开只读镜像 · 内容不构成投资建议 · 市场有风险，决策需独立判断</footer>
  <script src="app.js" defer></script>
</body>
</html>
